<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopen - Satıcıyı Puanla</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; background: #e0e7ff; display: flex; align-items: center; justify-content: center; }
        .container { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .star { font-size: 2rem; color: #ccc; cursor: pointer; }
        .star.checked { color: #f1ea73; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Satıcıyı Puanla</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST" action="{{ url_for('puanla', siparis_id=siparis_id) }}">
            <div class="mb-3">
                <label>Satıcıyı 5 yıldız üzerinden puanlayın:</label>
                <div class="stars" id="rating">
                    {% for i in range(1, 6) %}
                        <span class="star" data-value="{{ i }}">★</span>
                    {% endfor %}
                </div>
                <input type="hidden" name="puan" id="puan" value="">
            </div>
            <button type="submit" class="btn btn-primary">Puanla</button>
            <a href="{{ url_for('siparisler') }}" class="btn btn-secondary">Geri Dön</a>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const stars = document.querySelectorAll('.star');
        const puanInput = document.getElementById('puan');
        stars.forEach(star => {
            star.addEventListener('click', () => {
                const value = star.getAttribute('data-value');
                puanInput.value = value;
                stars.forEach(s => s.classList.remove('checked'));
                star.classList.add('checked');
                for (let i = 0; i < value; i++) {
                    stars[i].classList.add('checked');
                }
            });
        });
    </script>
</body>
</html>
