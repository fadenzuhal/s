<!DOCTYPE html>
<html>
<head>
    <title>Yeni Hata Ekle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Yeni Hata Ekle</h1>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Ürün Adı</label>
                <input type="text" class="form-control" name="urun_adi" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Bayi Adı</label>
                <input type="text" class="form-control" name="bayi_adi" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Hata Tarihi</label>
                <input type="date" class="form-control" name="hata_tarihi" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Hata Türü</label>
                <input type="text" class="form-control" name="hata_turu" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Durum</label>
                <select class="form-control" name="durum" required>
                    <option value="Açık">Açık</option>
                    <option value="Çözüldü">Çözüldü</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Ekle</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Geri</a>
        </form>
    </div>
</body>
</html>
