<!DOCTYPE html>
<html>
<head>
    <title>Sipariş Durum Analizi</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .alert {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        .alert-danger {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        canvas {
            max-width: 600px;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <h1>Sipariş Durum Analizi</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    {% if chart %}
        <canvas id="siparisDurumChart"></canvas>
        <script>
            const ctx = document.getElementById('siparisDurumChart').getContext('2d');
            new Chart(ctx, {{ chart|tojson|safe }});
        </script>
    {% else %}
        <p>Grafik verisi bulunamadı.</p>
    {% endif %}
    <a href="{{ url_for('siparisler') }}">Siparişlere Geri Dön</a>
</body>
</html>
