<!DOCTYPE html>
<html>
<head>
    <title>Hata Düzenle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Hata Düzenle</h1>
        {% if hata %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Ürün Adı</label>
                <input type="text" class="form-control" name="urun_adi" value="{{ hata.urun_adi }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Bayi Adı</label>
                <input type="text" class="form-control" name="bayi_adi" value="{{ hata.bayi_adi }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Hata Tarihi</label>
                <input type="date" class="form-control" name="hata_tarihi" value="{{ hata.hata_tarihi }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Hata Türü</label>
                <input type="text" class="form-control" name="hata_turu" value="{{ hata.hata_turu }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Durum</label>
                <select class="form-control" name="durum" required>
                    <option value="Açık" {% if hata.durum == 'Açık' %}selected{% endif %}>Açık</option>
                    <option value="Çözüldü" {% if hata.durum == 'Çözüldü' %}selected{% endif %}>Çözüldü</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Kaydet</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Geri</a>
        </form>
        {% else %}
        <p>Hata bulunamadı.</p>
        {% endif %}
    </div>
</body>
</html>
