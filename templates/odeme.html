<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Ödeme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ödeme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/adopen-style.css') }}">

</head>
<body>
    <div class="container mt-3">
        <h1>Ödeme Yap</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Sipariş ID</label>
                <input type="text" class="form-control" name="siparis_id" value="{{ request.args.get('siparis_id') }}" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">Tutar (TL)</label>
                <input type="number" class="form-control" name="tutar" step="0.01" required placeholder="Beklenen tutarı girin">
            </div>
            <button type="submit" class="btn btn-primary">Ödeme Yap</button>
        </form>
        <a href="{{ url_for('alicilar_analiz') }}" class="btn btn-secondary mt-2">Geri Dön</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
