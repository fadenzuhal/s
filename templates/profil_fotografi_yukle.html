<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Fotoğrafı Yükle - Adopen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/adopen-style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <h2>Profil Fotoğrafı Yükle</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-adopen">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="profil_fotografi" class="form-label">Fotoğraf Seç</label>
                <input type="file" class="form-control" id="profil_fotografi" name="profil_fotografi" accept="image/png,image/jpeg,image/gif" required>
            </div>
            <button type="submit" class="btn btn-adopen">Yükle</button>
            <a href="{{ url_for('profil') }}" class="btn btn-secondary">İptal</a>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
